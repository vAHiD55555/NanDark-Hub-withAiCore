kind = "web"
previewPath = "/"
title = "SaaS KPI Dashboard"
version = "1.0.0"
id = "artifacts/kpi-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20631

[services.development]
run = "pnpm --filter @workspace/kpi-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kpi-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/kpi-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20631"
BASE_PATH = "/"
