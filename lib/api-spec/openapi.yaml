openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SaaS KPI Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: metrics
    description: SaaS KPI metrics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics/summary:
    get:
      operationId: getMetricsSummary
      tags: [metrics]
      summary: Get high-level KPI summary
      description: Returns current period summary stats - total users, churn rate, retention rate, MRR, and trends vs prior period
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /metrics/user-growth:
    get:
      operationId: getUserGrowth
      tags: [metrics]
      summary: Get user growth over time
      description: Returns monthly new users, churned users, and cumulative active users
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [3m, 6m, 12m, 24m]
            default: 12m
      responses:
        "200":
          description: User growth data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGrowthPoint"

  /metrics/churn:
    get:
      operationId: getChurnMetrics
      tags: [metrics]
      summary: Get churn rate over time
      description: Returns monthly churn rate and churned user counts
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [3m, 6m, 12m, 24m]
            default: 12m
      responses:
        "200":
          description: Churn metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChurnPoint"

  /metrics/retention:
    get:
      operationId: getRetentionCohorts
      tags: [metrics]
      summary: Get retention cohort data
      description: Returns cohort-based retention rates for each month cohort across subsequent months
      parameters:
        - name: cohorts
          in: query
          required: false
          schema:
            type: integer
            minimum: 3
            maximum: 12
            default: 6
      responses:
        "200":
          description: Retention cohort table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetentionCohort"

  /metrics/mrr:
    get:
      operationId: getMrrTrend
      tags: [metrics]
      summary: Get MRR trend over time
      description: Returns monthly MRR, new MRR, expansion MRR, and churned MRR
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [3m, 6m, 12m, 24m]
            default: 12m
      responses:
        "200":
          description: MRR trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MrrPoint"

  /metrics/segments:
    get:
      operationId: getUserSegments
      tags: [metrics]
      summary: Get user breakdown by plan/segment
      description: Returns current user distribution across plan tiers
      responses:
        "200":
          description: User segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSegment"

  /financial/instruments:
    get:
      operationId: getFinancialInstruments
      tags: [financial]
      summary: List all tracked financial instruments
      responses:
        "200":
          description: List of instruments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialInstrument"

  /financial/summary:
    get:
      operationId: getFinancialSummary
      tags: [financial]
      summary: Current price + 24h/7d/30d change for all instruments
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialSummaryItem"

  /financial/prices/{symbol}:
    get:
      operationId: getFinancialPrices
      tags: [financial]
      summary: Historical OHLC price data for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 1y
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricePoint"

  /financial/creative-pick:
    get:
      operationId: getCreativePick
      tags: [financial]
      summary: AI-selected high-potential investment pick with analysis
      responses:
        "200":
          description: Creative pick analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativePick"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MetricsSummary:
      type: object
      required:
        - totalUsers
        - activeUsers
        - monthlyChurnRate
        - annualChurnRate
        - retentionRate
        - mrr
        - arr
        - newUsersThisMonth
        - churnedUsersThisMonth
        - totalUsersDelta
        - mrrDelta
        - churnRateDelta
        - retentionRateDelta
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        monthlyChurnRate:
          type: number
          description: Monthly churn rate as a percentage (e.g. 2.5 = 2.5%)
        annualChurnRate:
          type: number
          description: Annual churn rate as a percentage
        retentionRate:
          type: number
          description: Monthly retention rate as a percentage
        mrr:
          type: number
          description: Monthly Recurring Revenue in USD
        arr:
          type: number
          description: Annual Recurring Revenue in USD
        newUsersThisMonth:
          type: integer
        churnedUsersThisMonth:
          type: integer
        totalUsersDelta:
          type: number
          description: Percentage change vs prior month
        mrrDelta:
          type: number
          description: Percentage change vs prior month
        churnRateDelta:
          type: number
          description: Percentage point change vs prior month (negative is good)
        retentionRateDelta:
          type: number
          description: Percentage point change vs prior month

    UserGrowthPoint:
      type: object
      required:
        - month
        - newUsers
        - churnedUsers
        - netNewUsers
        - cumulativeUsers
      properties:
        month:
          type: string
          description: Month label (e.g. "Jan 2025")
        newUsers:
          type: integer
        churnedUsers:
          type: integer
        netNewUsers:
          type: integer
        cumulativeUsers:
          type: integer

    ChurnPoint:
      type: object
      required:
        - month
        - churnRate
        - churnedUsers
        - atRiskUsers
      properties:
        month:
          type: string
        churnRate:
          type: number
          description: Churn rate percentage for the month
        churnedUsers:
          type: integer
        atRiskUsers:
          type: integer
          description: Users flagged as at-risk of churning

    RetentionCohort:
      type: object
      required:
        - cohortMonth
        - cohortSize
        - retention
      properties:
        cohortMonth:
          type: string
          description: Cohort start month label (e.g. "Jan 2025")
        cohortSize:
          type: integer
          description: Number of users who joined in this cohort
        retention:
          type: array
          description: Retention rate at month 0, 1, 2, ... (100 = all retained)
          items:
            type: ["number", "null"]

    MrrPoint:
      type: object
      required:
        - month
        - mrr
        - newMrr
        - expansionMrr
        - churnedMrr
        - netNewMrr
      properties:
        month:
          type: string
        mrr:
          type: number
        newMrr:
          type: number
        expansionMrr:
          type: number
        churnedMrr:
          type: number
        netNewMrr:
          type: number

    UserSegment:
      type: object
      required:
        - plan
        - users
        - percentage
        - mrr
      properties:
        plan:
          type: string
        users:
          type: integer
        percentage:
          type: number
        mrr:
          type: number

    FinancialInstrument:
      type: object
      required: [id, symbol, name, nameFa, unit, category, isCreativePick]
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: string
        nameFa:
          type: string
        unit:
          type: string
        category:
          type: string
        description:
          type: string
          nullable: true
        isCreativePick:
          type: integer

    FinancialSummaryItem:
      type: object
      required: [symbol, name, nameFa, unit, category, isCreativePick, price, change24h, change7d, change30d, high24h, low24h]
      properties:
        symbol:
          type: string
        name:
          type: string
        nameFa:
          type: string
        unit:
          type: string
        category:
          type: string
        isCreativePick:
          type: boolean
        price:
          type: number
        change24h:
          type: number
        change7d:
          type: number
        change30d:
          type: number
        high24h:
          type: number
        low24h:
          type: number

    PricePoint:
      type: object
      required: [date, open, high, low, close, changePct, normalizedPct]
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        changePct:
          type: number
        normalizedPct:
          type: number

    CreativePickThesis:
      type: object
      required: [title, summary, catalysts, risks, targetPrice, horizon]
      properties:
        title:
          type: string
        summary:
          type: string
        catalysts:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        targetPrice:
          type: number
        horizon:
          type: string

    CreativePickHistoryPoint:
      type: object
      required: [date, close, normalizedPct]
      properties:
        date:
          type: string
        close:
          type: number
        normalizedPct:
          type: number

    CreativePick:
      type: object
      required: [symbol, name, nameFa, unit, price, change90d, potentialScore, thesis, priceHistory]
      properties:
        symbol:
          type: string
        name:
          type: string
        nameFa:
          type: string
        unit:
          type: string
        price:
          type: number
        change90d:
          type: number
        potentialScore:
          type: number
        thesis:
          $ref: "#/components/schemas/CreativePickThesis"
        priceHistory:
          type: array
          items:
            $ref: "#/components/schemas/CreativePickHistoryPoint"
